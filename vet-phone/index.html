<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전화응대 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f5f7f8; --card:#fff; --ink:#1d2a30; --muted:#66757c; --line:#dde4e7;
  --accent:#0f8b7d; --accent-soft:#e2f4f1; --warn:#b45309; --warn-soft:#fff4e0;
  --danger:#c0392b; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181b; --card:#1b2327; --ink:#e6eef0; --muted:#94a3a8; --line:#2c373c;
    --accent:#3cc4b2; --accent-soft:#16332f; --warn:#f0b35a; --warn-soft:#3a2c14; --danger:#ef6f61; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181b; --card:#1b2327; --ink:#e6eef0; --muted:#94a3a8; --line:#2c373c;
  --accent:#3cc4b2; --accent-soft:#16332f; --warn:#f0b35a; --warn-soft:#3a2c14; --danger:#ef6f61; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header .logo{font-weight:700;font-size:18px;white-space:nowrap;cursor:pointer;text-decoration:none;color:var(--ink)}
header .search{flex:1;min-width:0}
header input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
main{max-width:1100px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:17px;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s, transform .1s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{font-size:30px}
.tile b{font-size:18px}
.tile small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.notes.one{grid-template-columns:minmax(0,760px)}
.note p a{color:var(--accent);word-break:break-all}
.note h3{margin:0 0 6px;font-size:16px}
.note p{margin:0;white-space:pre-wrap;color:var(--ink)}
.tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:999px;margin-right:4px}
.btn{text-decoration:none;color:var(--ink);display:inline-block;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field>label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:10px 18px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button.rec::after,.cmpcol.rec>b::after{content:' ⭐추천';font-size:.8em}
.tip{font-size:13px;color:var(--muted)}
.num{display:flex;align-items:center;gap:8px}
.num input{width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:20px}
.addon{display:flex;align-items:center;gap:8px;padding:6px 0}
.addon input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.result .total{font-size:32px;font-weight:700;color:var(--accent);margin:6px 0 12px}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.lines .cond{display:block;font-size:12px;color:var(--muted)}
.hint{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px}
.memo{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px}
.muted{color:var(--muted)}
mark{background:#ffe58a;color:#1d2a30;border-radius:3px}
table.edit{width:100%;border-collapse:collapse;font-size:14px}
table.edit th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.edit td{padding:4px;border-bottom:1px solid var(--line)}
table.edit input,table.edit select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:56px}
.scroll{overflow-x:auto}
.form input[type=text],.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.form textarea{min-height:110px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.back{margin-bottom:12px}
.items{margin-top:10px;background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.items ul,.cmpcol ul{margin:6px 0 0;padding-left:20px}
.items li,.cmpcol li{margin:2px 0}
.compare summary{cursor:pointer}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.cmpcol{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:14px}
.cmpcol:hover{border-color:var(--accent)}
.cmpcol.on{border:2px solid var(--accent);background:var(--accent-soft)}
.cmpcol b{font-size:16px}
.cmpprice{font-size:20px;font-weight:700;color:var(--accent);margin:4px 0}
table.edit textarea{width:100%;min-width:240px;min-height:90px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:var(--radius);padding:20px;max-width:420px;width:100%;white-space:pre-wrap}
.modal .row{justify-content:flex-end;margin-top:16px}
textarea#bk{width:100%;min-height:120px;font:12px/1.4 monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">🐾 전화응대 도우미</a>
  <div class="search"><input id="q" type="search" placeholder="검색 (예: 동물등록, 발치, ㅈㅅㅎ)  —  단축키 /" autocomplete="off"></div>
  <a class="btn sm" href="#/config">⚙️ 설정</a>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden><div class="box"><div id="mMsg"></div><div class="row"><button class="btn" id="mNo">취소</button><button class="btn pri" id="mYes">확인</button></div></div></div>

<script>
'use strict';
const KEY = 'vetPhone.data.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
const SPECIES = {dog:'개', cat:'고양이'};
const SEX = {M:'수컷', F:'암컷'};

/* ---------- 기본 데이터 (예시 가격! 설정에서 꼭 수정하세요) ---------- */
function R(o){ return Object.assign({id:uid(), label:'', option:'', species:'', sex:'', ageMin:null, ageMax:null, wMin:null, wMax:null, price:0, perKg:null}, o); }
function A(label, price, unit=false){ return {id:uid(), label, price, unit}; }
function O(name, species, items, extra={}){ return {id:uid(), name, species, items, tip:'', recMin:null, recMax:null, ...extra}; }
function checkupService(){
  const base = '기본신체검사\nCBC\n전해질검사\n심장사상충\n복부초음파\n혈청화학검사 17종\nX-Ray (흉부 + 복부)';
  return { id:uid(), name:'건강검진', icon:'🩺', fields:{species:true, sex:false, age:true, weight:false},
    options:[
      O('Basic', '', '기본신체검사\nCBC\n혈청화학검사 10종\nX-Ray (흉부 + 복부)\n심장사상충', {tip:'5살 이하 아이들에게 추천', recMax:6}),
      O('Standard', '', base, {tip:'6~7살 아이들에게 추천', recMin:6, recMax:8}),
      O('Premium(강아지)', 'dog', base+'\nSDMA\nT4\nTSH', {tip:'8살 이상 강아지에게 추천', recMin:8}),
      O('Premium(고양이)', 'cat', base+'\nSDMA\nNT proBNP', {tip:'8살 이상 고양이에게 추천', recMin:8}),
    ],
    rules:[
      R({label:'건강검진 Basic', option:'Basic', price:180000}),
      R({label:'건강검진 Standard', option:'Standard', price:300000}),
      R({label:'건강검진 Premium (강아지)', option:'Premium(강아지)', price:400000}),
      R({label:'건강검진 Premium (고양이)', option:'Premium(고양이)', price:400000}),
    ],
    addons:[],
    notes:'병원 자체 장비 보유로 검사 결과 당일 수령 가능!\n* 상담 후 검사 및 비용 조절 가능' };
}
// 가격표(표 형태) → 가격 줄. table[몸무게칸][나이칸], null은 비움
const AGE_4_8 = [[null,4],[4,8],[8,null]];
const AGE_8 = [[null,8],[8,null]];
const W5 = [[null,5],[5,10],[10,15],[15,20],[20,25],[25,30]];
function grid(label, extra, weights, ages, table){
  const out = [];
  weights.forEach(([wMin,wMax],i)=>ages.forEach(([ageMin,ageMax],j)=>{
    const v = table[i]?.[j]; if(v!=null) out.push(R({label, ...extra, wMin, wMax, ageMin, ageMax, price:v}));
  }));
  return out;
}
function neuterService(){
  return { id:uid(), name:'중성화', icon:'✂️', fields:{species:false, sex:true, age:true, weight:true},
    options:[],
    rules:[
      ...grid('중성화 수술 (수컷)', {sex:'M'}, W5, AGE_4_8, [
        [150000,200000,227000],[200000,250000,277000],[250000,300000,327000],
        [300000,350000,377000],[375000,425000,452000],[450000,500000,527000]]),
      ...grid('중성화 수술 (암컷)', {sex:'F'}, W5.slice(0,4), AGE_4_8, [
        [300000,350000,377000],[350000,400000,427000],[400000,450000,477000],[450000,500000,527000]]),
      R({label:'중성화 수술 (암컷)', sex:'F', wMin:20, ageMax:4, price:450000, perKg:10000}),
      R({label:'중성화 수술 (암컷)', sex:'F', wMin:20, ageMin:4, ageMax:8, price:500000, perKg:10000}),
      R({label:'중성화 수술 (암컷)', sex:'F', wMin:20, ageMin:8, price:527000, perKg:10000}),
    ],
    addons:[],
    notes:'* 잠복고환 추가비용 별도 *\n수컷 30kg 이상은 가격표에 없음 → 상담' };
}
function scalingService(){
  return { id:uid(), name:'스케일링', icon:'🦷', fields:{species:false, sex:false, age:true, weight:true},
    options:[],
    rules: grid('스케일링', {}, W5.slice(0,5), AGE_8, [
      [250000,327000],[300000,377000],[350000,427000],[450000,527000],[550000,627000]]),
    addons:[],
    notes:'* 치과방사선/발치 비용 별도 *\n25kg 이상은 가격표에 없음 → 상담' };
}
function N(title, tags, pinned, content){ return {id:uid(), title, tags, pinned, content}; }
function clinicNotes(){
  return [
    N('진료 시간', ['기본','시간'], true,
`월·화·목·금: 10:00 ~ 20:00 (접수 마감 19:30)
수·토·공휴일: 10:00 ~ 18:30 (접수 마감 18:00)`),
    N('금식 안내 (수술·스케일링·건강검진)', ['금식','수술','스케일링','건강검진'], true,
`8시간 금식 (수술, 스케일링, 건강검진)
물은 마셔도 괜찮아요.
전날 저녁까지만 주시고, 그 이후로는 먹이지 마세요.`),
    N('동물등록 지원 (시 지원)', ['동물등록','지원','경기도'], false,
`■ 경기도만 가능, 타 지역은 안 됨
 - 주민등록 주소가 경기도면 가능
 - 현재 사는 곳이 서울이어도 주민등록 주소가 경기도면 가능
 - 제주도 등 다른 지역에 살다가 경기도로 이사 와서 해도 가능
■ 비용: 10,000원 (경기도에서는 모두 가능)
■ 판단 기준: 전 소유자 정보와 상관없이, 변경할(새) 소유자 정보 기준`),
    N('동물등록 정보변경', ['동물등록','변경','소유자변경','정부24'], false,
`■ 변경 가능: 주소, 핸드폰 번호 등
■ 신고 기한: 소유자 변경, 성명·주소·전화번호 변경, 사망 → 한 달 이내

■ 주의! 지자체로만 가능한 경우 (꼭!)
 - 소유자 변경: 받는 사람 기준으로 지자체로만 가능
 - 외장 → 내장으로 변경: 경기도여도 지자체로 해야 함
 - 예) 안산에서 시흥으로 오는 것 → 가능
       시흥에서 안산으로 가는 것 → 안 됨

■ 신청 방법
 - 온라인: 정부24 / 국가동물보호정보시스템
   https://www.animal.go.kr/front/index.do
 - 동물병원 방문: 가능

■ 소유자 변경을 온라인으로 할 때
 1) 새 소유자가 먼저 소유자 변경 신청
 2) 기존 소유자가 10일 이내에 변경 동의

■ 방문 신청이 필요한 경우
 - 기존 소유자와 연락이 안 될 때
 - 온라인 신청이 안 될 때
 - 유기동물 입양일 때`),
    N('동물등록카드 발급', ['동물등록','등록카드','발급'], false,
`■ 다른 지역 거주자는 자동 발급 불가
 - 예) 시흥시에서 동물등록 변경 신고를 했어도 안산시 거주자면 발급 안 됨
   → 안산시청에서 발급받아야 함
■ 판단 기준: 전 소유자 정보와 상관없이, 변경할(새) 소유자 정보 기준`),
    N('발치 상담', ['발치','치과','유치','마취','스케일링'], false,
`■ 물어볼 것
 1. 몸무게
 2. 나이
 3. 혹시 지병이 있는지 (먹고 있는 약)
 4. → 마취 후 발치해야 한다고 안내

■ 경우별 안내
 - 이가 많이 흔들림: 무마취로 그냥 뺄 수도 있음
 - 치아 파절: 마취 필요
 - 유치가 흔들림: 터그놀이나 간식 권함
 - 유치가 안 흔들림: 수술적으로 빼야 함 (마취)
 - 유치는 보통 중성화 때 같이 함? (확인 필요)

■ 비용 안내
 - 나이·몸무게에 맞는 마취 비용 안내
 - 피검사: 8살 이하 CBC + chem10
           8살 이상 CBC + chem17 + 전해질
 - 치과 방사선 비용 별도
 - 발치 비용 별도, 치아마다 다름 (검색)

■ 스케일링과 함께 발치 진행 권유
 - 따로 하면 비용이 비슷하게 들어서 같이 하도록 권유`),
    N('예방접종 안내', ['접종','예방접종','백신','광견병','종합','코로나','켄넬','신종플루'], false,
`■ 강아지 (총 6차, 2주 간격)
 백신 가격: 종합 30,000 / 코로나 25,000 / 켄넬 25,000
            광견병 25,000 / 신종플루 40,000
 → 각 1회씩 모두 = 145,000원

 1차 종합 + 코로나      55,000원
 2차 종합 + 코로나      55,000원
 3차 종합 + 켄넬        55,000원
 4차 종합 + 켄넬        55,000원
 5차 종합 + 신종플루    70,000원
 6차 신종플루 + 광견병  65,000원
 → 6차 전체 = 355,000원

■ 국가접종 (광견병): 4월 중순, 10월 중순 진행

■ 고양이 (총 3차, 3주 간격)
 백신 가격: 종합 45,000 / 광견병 25,000
 고양이 광견병은 선택사항
 → 종합 3차 = 135,000원
 → 종합 3차 + 광견병 = 160,000원`),
    N('건강검진 + 스케일링', ['건강검진','스케일링','노령'], false,
`■ 나이에 맞는 건강검진 + 스케일링 같이 가능

■ 건강검진 후 추가 스케일링 비용
 - 5kg 이하: +15만원
 - 몸무게에 따라 +5만원씩 추가 (엑셀 참고)
 - 치과 방사선 / 발치 비용 별도

■ 노령 아이
 - 베이직 X
 - 노령검사가 포함된 스탠다드, 프리미엄으로 안내`),
  ];
}
function defaults(){
  return {
    version:7,
    services:[
      checkupService(),
      scalingService(),
      neuterService(),
    ],
    notes: clinicNotes(),
  };
}

/* ---------- 저장 ---------- */
function normalize(d){
  if(!d || !Array.isArray(d.services) || !Array.isArray(d.notes)) throw new Error('형식 오류');
  d.services.forEach(s=>{ s.id ||= uid(); s.fields ||= {}; s.options ||= []; s.rules ||= []; s.addons ||= []; s.notes ||= '';
    s.options = s.options.map(o => typeof o==='string' ? O(o,'','') : {id:o.id||uid(), name:o.name||'', species:o.species||'', items:o.items||'', tip:o.tip||'', recMin:o.recMin??null, recMax:o.recMax??null});
    s.rules = s.rules.map(r=>R(r)); s.addons.forEach(a=>{a.id ||= uid();}); });
  d.notes.forEach(n=>{ n.id ||= uid(); n.tags ||= []; });
  // v1 → v2: 손대지 않은 예전 건강검진(기본/정밀)은 새 패키지로 교체
  if(!(d.version >= 2)){
    const i = d.services.findIndex(s=>s.name==='건강검진' && s.options.map(o=>o.name).join()==='기본,정밀');
    if(i>=0) d.services[i] = Object.assign(checkupService(), {id:d.services[i].id});
    d.version = 2;
  }
  // v2 → v3: 병원 실제 가격표로 중성화·스케일링 교체
  if(d.version < 3){
    [['중성화', neuterService], ['스케일링', scalingService]].forEach(([name, make])=>{
      const i = d.services.findIndex(s=>s.name===name);
      if(i>=0) d.services[i] = Object.assign(make(), {id:d.services[i].id, icon:d.services[i].icon||make().icon});
      else d.services.push(make());
    });
    d.version = 3;
  }
  // v3 → v4: 병원 실제 건강검진 패키지로 교체
  if(d.version < 4){
    const i = d.services.findIndex(s=>s.name==='건강검진');
    if(i>=0) d.services[i] = Object.assign(checkupService(), {id:d.services[i].id});
    else d.services.unshift(checkupService());
    d.version = 4;
  }
  // v4 → v5: 병원 실제 안내문 반영 (진료시간·금식 교체, 주차 삭제, 동물등록·발치 등 추가)
  if(d.version < 5){
    const fresh = clinicNotes();
    const byTitle = t => d.notes.findIndex(n=>n.title===t);
    const replace = (oldTitle, nn) => { const i = byTitle(oldTitle); if(i>=0) d.notes[i] = Object.assign(nn, {id:d.notes[i].id}); else d.notes.push(nn); };
    replace('진료 시간', fresh[0]);
    replace('수술·마취 전 금식', fresh[1]);
    d.notes = d.notes.filter(n => n.title!=='주차 안내' && !(n.title==='예약 변경·취소' && n.content==='전날까지 전화로 변경/취소 부탁드립니다.'));
    fresh.slice(2).forEach(nn => { if(byTitle(nn.title)<0) d.notes.push(nn); });
    d.version = 5;
  }
  // v5 → v6: 예방접종 안내문 추가
  if(d.version < 6){
    const vn = clinicNotes().find(n=>n.title==='예방접종 안내');
    if(!d.notes.some(n=>n.title===vn.title)) d.notes.push(vn);
    d.version = 6;
  }
  // v6 → v7: 예방접종 계산 화면 제거 (안내문만 사용)
  if(d.version < 7){
    d.services = d.services.filter(s=>s.name!=='예방접종');
    d.version = 7;
  }
  return d;
}
function load(){
  try { const s = localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s)); } catch(e){ console.warn(e); }
  return defaults();
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }
function ask(msg, okOnly=false){

  });
}

async function copyText(text){

/* ---------- 계산 ---------- */
function inRange(v, min, max){
  if(min==null && max==null) return true;
  if(v==null || Number.isNaN(v)) return null; // 값이 없어서 판단 불가
  if(min!=null && v < min) return false;
  if(max!=null && v >= max) return false;
  return true;
}
function rangeText(min, max, unit){
  if(min!=null && max!=null) return `${min}${unit} 이상 ${max}${unit} 미만`;
  if(min!=null) return `${min}${unit} 이상`;
  if(max!=null) return `${max}${unit} 미만`;
  return '';
}
function condText(r){
  return [r.option, SPECIES[r.species], SEX[r.sex], rangeText(r.wMin,r.wMax,'kg'), rangeText(r.ageMin,r.ageMax,'세'), r.perKg && r.wMin!=null ? `${r.wMin}kg 초과 kg당 +${won(r.perKg)}` : ''].filter(Boolean).join(' · ') || '항상';
}
function calculate(svc, inp){
  const missing = [];
  const f = svc.fields;
  if(f.species && !inp.species) missing.push('종');
  if(f.sex && !inp.sex) missing.push('성별');
  const uses = (a,b) => svc.rules.some(r => (!r.option || r.option===inp.option) && (r[a]!=null || r[b]!=null));
  if(f.age && inp.age==null && uses('ageMin','ageMax')) missing.push('나이');
  if(f.weight && inp.weight==null && uses('wMin','wMax')) missing.push('몸무게');
  const lines = [];
  for(const r of svc.rules){
    if(r.option && svc.options.length && r.option !== inp.option) continue;
    if(r.species && f.species && r.species !== inp.species) continue;
    if(r.sex && f.sex && r.sex !== inp.sex) continue;
    const a = inRange(inp.age, r.ageMin, r.ageMax), w = inRange(inp.weight, r.wMin, r.wMax);
    if(a===false || w===false || a===null || w===null) continue;
    let price = Number(r.price)||0, label = r.label;
    if(r.perKg && r.wMin!=null && inp.weight!=null){
      const over = Math.ceil(Math.round((inp.weight - r.wMin)*100)/100); // kg 단위 올림
      if(over > 0){ price += over * r.perKg; label += ` (${won(r.price)} + ${over}kg × ${won(r.perKg)})`; }
    }
    lines.push({label, cond:condText(r), price});
  }
  for(const ad of svc.addons){
    const q = inp.addons[ad.id] || 0;
    if(q>0) lines.push({label: ad.label + (ad.unit ? ` × ${q}` : ''), cond:'추가 항목', price:(Number(ad.price)||0)*(ad.unit?q:1)});
  }
  return {missing, lines, total: lines.reduce((s,l)=>s+l.price,0)};
}

/* ---------- 초성 검색 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const toCho = s => [...s].map(c=>{ const k=c.charCodeAt(0)-0xAC00; return (k>=0 && k<11172) ? CHO[Math.floor(k/588)] : c; }).join('');
const isChoQuery = q => /^[ㄱ-ㅎ\s]+$/.test(q);
function matchText(text, q){
  text = String(text||'').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(t => isChoQuery(t) ? toCho(text).includes(t) : text.includes(t));
}
function highlight(text, q){
  let h = esc(text);
  q.split(/\s+/).filter(t=>t && !isChoQuery(t)).forEach(t=>{
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    h = h.replace(re, m=>`<mark>${m}</mark>`);
  });
  return h;
}

  const svcs = q ? data.services.filter(s=>matchText([s.name,s.notes,...s.options.map(o=>o.name+' '+o.items),...s.rules.map(r=>r.label),...s.addons.map(a=>a.label)].join(' '), q)) : [];
  box.innerHTML = `
    ${svcs.length?`<h2>가격 계산</h2><div class="grid">${svcs.map(s=>`<a class="tile" href="#/svc/${s.id}" style="text-decoration:none;color:inherit"><span class="ic">${esc(s.icon||'📋')}</span><b>${highlight(s.name,q)}</b><small>${esc(fieldsLabel(s))}</small></a>`).join('')}</div>`:''}
    <h2>안내문 ${notes.length}개</h2>
    ${notes.length?`<div class="notes">${notes.map(n=>noteCard(n,q)).join('')}</div>`:`<p class="muted">검색 결과가 없습니다. <a href="#/config/note/new">새 안내문 추가</a></p>`}`;
}
$('#q').addEventListener('input', e=>{
  const q = e.target.value;
  if(!location.hash.startsWith('#/search')) history.replaceState(null,'','#/search/'+encodeURIComponent(q)), renderSearch(q);
  else { history.replaceState(null,'','#/search/'+encodeURIComponent(q)); updateSearch(q); }
});
$('#q').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const t = $('#searchResults a.tile'); if(t) location.hash = t.getAttribute('href'); }
});
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape' && !$('#modal').hidden){ $('#mNo').click(); return; }
  if(e.key==='Escape'){ document.activeElement.blur(); location.hash='#/'; }
});

/* ---------- 설정 ---------- */
function renderSettings(){
  view.innerHTML = `
    <div class="back"><a class="btn sm" href="#/">← 처음으로</a></div>
    <h1>⚙️ 설정</h1>
    <h2>가격 계산 항목</h2>
    <div class="card">${data.services.map((s,i)=>`
      <div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${esc(s.icon)} <b>${esc(s.name)}</b> <span class="muted">· 가격 ${s.rules.length}줄 · 추가항목 ${s.addons.length}개</span></span>
        <span class="row"><button class="btn sm" data-move="${i}" data-d="-1">▲</button><button class="btn sm" data-move="${i}" data-d="1">▼</button><a class="btn sm" href="#/config/svc/${s.id}">수정</a></span>
      </div>`).join('')}
      <div style="margin-top:10px"><button class="btn pri sm" id="addSvc">+ 항목 추가 (예: 예방접종, 미용)</button></div>
    </div>
    <h2>안내문 (검색용)</h2>
    <div class="card">${data.notes.map(n=>`
      <div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${n.pinned?'📌 ':''}<b>${esc(n.title)}</b> ${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span>
        <a class="btn sm" href="#/config/note/${n.id}">수정</a>
      </div>`).join('')}
      <div style="margin-top:10px"><a class="btn pri sm" href="#/config/note/new">+ 안내문 추가</a></div>
    </div>
    <h2>백업 / 다른 컴퓨터로 옮기기</h2>
    <div class="card">
      <p class="muted" style="margin-top:0">데이터는 이 컴퓨터의 이 브라우저에만 저장됩니다. 브라우저 기록 삭제 시 지워질 수 있으니 가끔 백업 파일을 받아두세요. 병원 컴퓨터로 옮길 때도 백업 파일을 불러오면 됩니다.</p>
      <div class="row">
        <button class="btn pri" id="export">💾 백업 파일 받기</button>
        <label class="btn">📂 백업 파일 불러오기<input type="file" id="import" accept=".json,application/json" hidden></label>
        <button class="btn danger" id="resetAll">처음 예시 데이터로 되돌리기</button>
      </div>
      <p class="muted" style="margin-bottom:6px">파일 받기가 안 될 때: 아래 백업 글자를 복사해 메모장 등에 보관하고, 옮길 곳에서 붙여넣은 뒤 [붙여넣은 내용 불러오기]를 누르세요.</p>
      <textarea id="bk" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="bkCopy">백업 글자 복사</button><button class="btn" id="bkLoad">붙여넣은 내용 불러오기</button></div>
    </div>`;
  view.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.move, j=i+(+b.dataset.d); if(j<0||j>=data.services.length) return;
    [data.services[i],data.services[j]]=[data.services[j],data.services[i]]; save(); renderSettings();
  });
  $('#addSvc').onclick = () => {
    const s = {id:uid(), name:'새 항목', icon:'📋', fields:{species:true, sex:false, age:false, weight:true}, options:[], rules:[R({label:'기본 가격', price:0})], addons:[], notes:''};
    data.services.push(s); save(); location.hash = '#/config/svc/'+s.id;
  };
  $('#export').onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `전화응대_백업_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#bk').value = JSON.stringify(data);
  $('#bkCopy').onclick = () => copyText(JSON.stringify(data));
  const importText = async text => {
    try { const d = normalize(JSON.parse(text));
      if(!await ask(`가격 항목 ${d.services.length}개, 안내문 ${d.notes.length}개를 불러옵니다.\n지금 데이터는 덮어씌워집니다. 계속할까요?`)) return;
      data = d; save(); toast('불러왔습니다'); renderSettings();
    } catch(err){ tell('불러오기 실패: 올바른 백업 파일이 아닙니다.'); }
  };
  $('#bkLoad').onclick = () => importText($('#bk').value);
  $('#import').onchange = async e => { const file = e.target.files[0]; if(file) importText(await file.text()); e.target.value=''; };
  $('#resetAll').onclick = async () => { if(await ask('모든 데이터를 지우고 예시 데이터로 되돌립니다. 계속할까요?')){ data = defaults(); save(); renderSettings(); toast('초기화했습니다'); } };
}

function renderEditService(id){
  const s = data.services.find(x=>x.id===id); if(!s){ location.hash='#/config'; return; }
  const sel = (key, val, opts) => `<select data-k="${key}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===(val||'')?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const nv = v => v==null ? '' : v;
  view.innerHTML = `
    <div class="back row"><a class="btn sm" href="#/config">← 설정</a><a class="btn sm" href="#/svc/${s.id}">계산 화면 보기</a></div>
    <h1>${esc(s.icon)} ${esc(s.name)} 수정</h1>
    <p class="muted">수정하면 바로 저장됩니다.</p>
    <div class="card form">
      <div class="row" style="align-items:flex-end">
        <div style="width:80px"><label class="muted">아이콘</label><input type="text" id="sIcon" value="${esc(s.icon)}"></div>
        <div style="flex:1;min-width:160px"><label class="muted">이름</label><input type="text" id="sName" value="${esc(s.name)}"></div>
      </div>
      <div class="field" style="margin-top:12px"><label>전화 받을 때 물어볼 것</label>
        <div class="row">${[['species','종 (개/고양이)'],['sex','성별'],['age','나이'],['weight','몸무게']].map(([k,l])=>`<label><input type="checkbox" data-field="${k}" ${s.fields[k]?'checked':''}> ${l}</label>`).join('')}</div>
      </div>
    </div>

    <h2>종류 (패키지)</h2>
    <p class="muted" style="margin-top:-4px;font-size:14px">예: 베이직·스탠다드·프리미엄. 없으면 비워두세요. 검사 항목은 한 줄에 하나씩. "대상"을 정하면 그 종을 골랐을 때만 보입니다.</p>
    <div class="card scroll"><table class="edit" id="opts">
      <tr><th>이름</th><th>대상</th><th>추천 문구</th><th>추천 나이 이상</th><th>추천 나이 미만</th><th>검사 / 포함 항목</th><th></th></tr>
      ${s.options.map(o=>`<tr data-id="${o.id}">
        <td style="min-width:140px"><input data-k="name" value="${esc(o.name)}"></td>
        <td>${sel('species', o.species, [['','전체'],['dog','개'],['cat','고양이']])}</td>
        <td style="min-width:150px"><input data-k="tip" value="${esc(o.tip)}"></td>
        <td><input data-k="recMin" data-n type="number" step="1" value="${nv(o.recMin)}"></td>
        <td><input data-k="recMax" data-n type="number" step="1" value="${nv(o.recMax)}"></td>
        <td><textarea data-k="items">${esc(o.items)}</textarea></td>
        <td><button class="btn sm danger" data-del>✕</button></td></tr>`).join('')}
    </table>
    <button class="btn sm pri" id="addOpt" style="margin-top:10px">+ 종류 추가</button></div>

    <h2>가격표</h2>
    <p class="muted" style="margin-top:-4px;font-size:14px">조건에 맞는 줄이 <b>모두 더해집니다</b>. 빈 칸 = 상관없음. 범위는 "이상 ~ 미만" (예: 5 ~ 10kg 은 5kg 이상 10kg 미만).</p>
    <div class="card scroll"><table class="edit" id="rules">
      <tr><th>내용</th>${s.options.length?'<th>종류</th>':''}<th>종</th><th>성별</th><th>kg 이상</th><th>kg 미만</th><th>나이 이상</th><th>나이 미만</th><th>가격(원)</th><th>초과 kg당(원)</th><th></th></tr>
      ${s.rules.map(r=>`<tr data-id="${r.id}">
        <td style="min-width:180px"><input data-k="label" value="${esc(r.label)}"></td>
        ${s.options.length?`<td>${sel('option', r.option, [['','전체'],...s.options.map(o=>[o.name,o.name])])}</td>`:''}
        <td>${sel('species', r.species, [['','전체'],['dog','개'],['cat','고양이']])}</td>
        <td>${sel('sex', r.sex, [['','전체'],['M','수컷'],['F','암컷']])}</td>
        <td><input data-k="wMin" data-n type="number" step="0.1" value="${nv(r.wMin)}"></td>
        <td><input data-k="wMax" data-n type="number" step="0.1" value="${nv(r.wMax)}"></td>
        <td><input data-k="ageMin" data-n type="number" step="0.5" value="${nv(r.ageMin)}"></td>
        <td><input data-k="ageMax" data-n type="number" step="0.5" value="${nv(r.ageMax)}"></td>
        <td style="min-width:110px"><input data-k="price" data-n type="number" step="1000" value="${nv(r.price)}"></td>
        <td style="min-width:90px"><input data-k="perKg" data-n type="number" step="1000" value="${nv(r.perKg)}" title="kg 이상 값을 넘는 몸무게 1kg마다 더할 금액"></td>
        <td class="row" style="flex-wrap:nowrap"><button class="btn sm" data-dup title="복사">⧉</button><button class="btn sm danger" data-del title="삭제">✕</button></td></tr>`).join('')}
    </table>
    <button class="btn sm pri" id="addRule" style="margin-top:10px">+ 가격 줄 추가</button></div>

    <h2>추가 항목 (체크해서 더하는 것)</h2>
    <div class="card scroll"><table class="edit" id="addons">
      <tr><th>내용</th><th>가격(원)</th><th>수량 입력</th><th></th></tr>
      ${s.addons.map(a=>`<tr data-id="${a.id}"><td style="min-width:180px"><input data-k="label" value="${esc(a.label)}"></td>
        <td><input data-k="price" data-n type="number" step="1000" value="${nv(a.price)}"></td>
        <td><input data-k="unit" type="checkbox" ${a.unit?'checked':''} style="width:auto"> 개수/박수</td>
        <td><button class="btn sm danger" data-del>✕</button></td></tr>`).join('')}
    </table>
    <button class="btn sm pri" id="addAddon" style="margin-top:10px">+ 추가 항목</button></div>

    <h2>안내 메모 (계산 화면에 같이 보임)</h2>
    <div class="card form"><textarea id="sNotes">${esc(s.notes)}</textarea></div>

    <div style="margin-top:24px"><button class="btn danger" id="delSvc">이 항목 전체 삭제</button></div>`;

  $('#sIcon').oninput = e => { s.icon = e.target.value; save(); };
  $('#sName').oninput = e => { s.name = e.target.value; save(); };
  $('#sNotes').oninput = e => { s.notes = e.target.value; save(); };
  view.querySelectorAll('[data-field]').forEach(cb=>cb.onchange=()=>{ s.fields[cb.dataset.field]=cb.checked; save(); });
  const bindTable = (tableId, list, rerender) => {
    const t = $('#'+tableId);
    const handler = e => {
      const tr = e.target.closest('tr[data-id]'); const k = e.target.dataset.k; if(!tr || !k) return;
      const item = list.find(x=>x.id===tr.dataset.id); if(!item) return;
      if(list===s.options && k==='name'){ // 이름 바꾸면 가격표 연결도 같이 바꿈
        const nn = e.target.value.trim();
        s.rules.forEach(r=>{ if(r.option===item.name) r.option = nn; });
        item.name = nn; save(); if(e.type==='change') rerender(); return;
      }
      if(e.target.type==='checkbox') item[k] = e.target.checked;
      else if('n' in e.target.dataset) item[k] = e.target.value==='' ? null : Number(e.target.value);
      else item[k] = e.target.value;
      save();
    };
    t.addEventListener('input', handler); t.addEventListener('change', handler);
    t.addEventListener('click', async e=>{
      const tr = e.target.closest('tr[data-id]'); if(!tr) return;
      const i = list.findIndex(x=>x.id===tr.dataset.id);
      if(e.target.closest('[data-del]')){ if(await ask('이 줄을 삭제할까요?')){ list.splice(i,1); save(); rerender(); } }
      if(e.target.closest('[data-dup]')){ list.splice(i+1,0,{...list[i], id:uid()}); save(); rerender(); }
    });
  };
  const re = () => renderEditService(id);
  bindTable('rules', s.rules, re);
  bindTable('addons', s.addons, re);
  bindTable('opts', s.options, re);
  $('#addOpt').onclick = () => { s.options.push(O('새 종류', '', '')); save(); re(); };
  $('#addRule').onclick = () => { s.rules.push(R({label:s.name})); save(); re(); };
  $('#addAddon').onclick = () => { s.addons.push(A('새 추가 항목', 0)); save(); re(); };
  $('#delSvc').onclick = async () => { if(await ask(`'${s.name}' 항목을 삭제할까요?`)){ data.services = data.services.filter(x=>x!==s); save(); location.hash='#/config'; } };
}

function renderEditNote(id){
  let n = data.notes.find(x=>x.id===id);
  const isNew = !n;
  if(isNew) n = {id:uid(), title:'', tags:[], pinned:false, content:''};
  view.innerHTML = `
    <div class="back"><a class="btn sm" href="#/config">← 설정</a></div>
    <h1>${isNew?'안내문 추가':'안내문 수정'}</h1>
    <div class="card form">
      <div class="field"><label>제목</label><input type="text" id="nTitle" value="${esc(n.title)}" placeholder="예: 진료 시간"></div>
      <div class="field"><label>태그 (쉼표로 구분)</label><input type="text" id="nTags" value="${esc(n.tags.join(', '))}" placeholder="예: 예약, 수술"></div>
      <div class="field"><label>내용</label><textarea id="nContent" style="min-height:200px">${esc(n.content)}</textarea></div>
      <label><input type="checkbox" id="nPin" ${n.pinned?'checked':''}> 📌 첫 화면에 고정</label>
      <div class="row" style="margin-top:16px">
        <button class="btn pri" id="nSave">저장</button>
        ${isNew?'':'<button class="btn danger" id="nDel">삭제</button>'}
      </div>
    </div>`;
  $('#nTitle').focus();
  $('#nSave').onclick = () => {
    const title = $('#nTitle').value.trim(); if(!title){ tell('제목을 입력하세요'); return; }
    Object.assign(n, {title, tags:$('#nTags').value.split(',').map(x=>x.trim()).filter(Boolean), content:$('#nContent').value, pinned:$('#nPin').checked});
    if(isNew) data.notes.push(n);
    save(); toast('저장했습니다'); location.hash = '#/config';
  };
  if(!isNew) $('#nDel').onclick = async () => { if(await ask('삭제할까요?')){ data.notes = data.notes.filter(x=>x!==n); save(); location.hash='#/config'; } };
}

route();
</script>
