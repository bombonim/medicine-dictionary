<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전화응대 도우미</title>
<style>
:root{
  --bg:#f5f7f8; --card:#fff; --ink:#1d2a30; --muted:#66757c; --line:#dde4e7;
  --accent:#0f8b7d; --accent-soft:#e2f4f1; --warn:#b45309; --warn-soft:#fff4e0;
  --danger:#c0392b; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181b; --card:#1b2327; --ink:#e6eef0; --muted:#94a3a8; --line:#2c373c;
    --accent:#3cc4b2; --accent-soft:#16332f; --warn:#f0b35a; --warn-soft:#3a2c14; --danger:#ef6f61;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;padding:10px 16px}
header .logo{font-weight:700;font-size:18px;white-space:nowrap;cursor:pointer;text-decoration:none;color:var(--ink)}
header .search{flex:1;min-width:0}
header input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:17px;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s, transform .1s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ic{font-size:30px}
.tile b{font-size:18px}
.tile small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.note h3{margin:0 0 6px;font-size:16px}
.note p{margin:0;white-space:pre-wrap;color:var(--ink)}
.tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:999px;margin-right:4px}
.btn{text-decoration:none;color:var(--ink);display:inline-block;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.calc{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field>label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:10px 18px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.num{display:flex;align-items:center;gap:8px}
.num input{width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:20px}
.addon{display:flex;align-items:center;gap:8px;padding:6px 0}
.addon input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.result .total{font-size:32px;font-weight:700;color:var(--accent);margin:6px 0 12px}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.lines .cond{display:block;font-size:12px;color:var(--muted)}
.hint{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px}
.memo{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px}
.muted{color:var(--muted)}
mark{background:#ffe58a;color:#1d2a30;border-radius:3px}
table.edit{width:100%;border-collapse:collapse;font-size:14px}
table.edit th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.edit td{padding:4px;border-bottom:1px solid var(--line)}
table.edit input,table.edit select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:56px}
.scroll{overflow-x:auto}
.form input[type=text],.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.form textarea{min-height:110px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.back{margin-bottom:12px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">🐾 전화응대 도우미</a>
  <div class="search"><input id="q" type="search" placeholder="검색 (예: 금식, 주차, ㅈㅅㅎ)  —  단축키 /" autocomplete="off"></div>
  <a class="btn sm" href="#/settings">⚙️ 설정</a>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'vetPhone.data.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
const SPECIES = {dog:'개', cat:'고양이'};
const SEX = {M:'수컷', F:'암컷'};

/* ---------- 기본 데이터 (예시 가격! 설정에서 꼭 수정하세요) ---------- */
function R(o){ return Object.assign({id:uid(), label:'', option:'', species:'', sex:'', ageMin:null, ageMax:null, wMin:null, wMax:null, price:0}, o); }
function A(label, price, unit=false){ return {id:uid(), label, price, unit}; }
function defaults(){
  return {
    version:1,
    services:[
      { id:uid(), name:'건강검진', icon:'🩺', fields:{species:true, sex:false, age:true, weight:true},
        options:['기본','정밀'],
        rules:[
          R({label:'기본 건강검진', option:'기본', species:'dog', wMax:5, price:150000}),
          R({label:'기본 건강검진', option:'기본', species:'dog', wMin:5, wMax:10, price:170000}),
          R({label:'기본 건강검진', option:'기본', species:'dog', wMin:10, wMax:20, price:190000}),
          R({label:'기본 건강검진', option:'기본', species:'dog', wMin:20, price:220000}),
          R({label:'기본 건강검진', option:'기본', species:'cat', price:160000}),
          R({label:'정밀 건강검진', option:'정밀', species:'dog', wMax:10, price:280000}),
          R({label:'정밀 건강검진', option:'정밀', species:'dog', wMin:10, price:330000}),
          R({label:'정밀 건강검진', option:'정밀', species:'cat', price:290000}),
          R({label:'노령 추가검사 (흉부 방사선)', ageMin:7, price:50000}),
        ],
        addons:[A('심장 초음파', 80000), A('호르몬 검사', 60000), A('안과 검사', 30000)],
        notes:'검사 전 8시간 금식 (물은 가능).\n소요 시간 약 2~3시간, 결과 상담 포함.' },
      { id:uid(), name:'스케일링', icon:'🦷', fields:{species:true, sex:false, age:true, weight:true},
        options:[],
        rules:[
          R({label:'스케일링 (마취 포함)', species:'dog', wMax:5, price:200000}),
          R({label:'스케일링 (마취 포함)', species:'dog', wMin:5, wMax:10, price:250000}),
          R({label:'스케일링 (마취 포함)', species:'dog', wMin:10, wMax:20, price:300000}),
          R({label:'스케일링 (마취 포함)', species:'dog', wMin:20, price:350000}),
          R({label:'스케일링 (마취 포함)', species:'cat', price:230000}),
          R({label:'마취 전 검사 (혈액·방사선)', ageMax:7, price:60000}),
          R({label:'마취 전 정밀검사 (7세 이상)', ageMin:7, price:100000}),
        ],
        addons:[A('발치 (개당)', 20000, true), A('치과 방사선', 50000), A('불소 도포', 20000)],
        notes:'전날 밤 10시 이후 금식.\n발치 여부는 마취 후 구강 상태 보고 결정 → 추가 비용 가능성 안내.' },
      { id:uid(), name:'중성화', icon:'✂️', fields:{species:true, sex:true, age:false, weight:true},
        options:[],
        rules:[
          R({label:'중성화 수술 (수컷)', species:'dog', sex:'M', wMax:10, price:250000}),
          R({label:'중성화 수술 (수컷)', species:'dog', sex:'M', wMin:10, price:320000}),
          R({label:'중성화 수술 (암컷)', species:'dog', sex:'F', wMax:5, price:350000}),
          R({label:'중성화 수술 (암컷)', species:'dog', sex:'F', wMin:5, wMax:10, price:400000}),
          R({label:'중성화 수술 (암컷)', species:'dog', sex:'F', wMin:10, price:480000}),
          R({label:'중성화 수술 (수컷)', species:'cat', sex:'M', price:150000}),
          R({label:'중성화 수술 (암컷)', species:'cat', sex:'F', price:300000}),
          R({label:'마취 전 검사', price:60000}),
        ],
        addons:[A('잠복고환 추가', 100000), A('넥카라', 15000), A('입원 (1박)', 50000, true)],
        notes:'수술 전 8시간 금식.\n실밥 제거: 수술 후 10~14일.\n발정 중에는 수술 불가할 수 있음.' },
    ],
    notes:[
      {id:uid(), title:'진료 시간', tags:['기본'], pinned:true, content:'평일 09:00 ~ 19:00\n토요일 09:00 ~ 15:00\n일요일·공휴일 휴진\n점심 13:00 ~ 14:00'},
      {id:uid(), title:'주차 안내', tags:['기본'], pinned:true, content:'건물 지하 주차장 1시간 무료 (접수 시 차량번호 말씀)'},
      {id:uid(), title:'수술·마취 전 금식', tags:['수술','검진'], pinned:true, content:'수술/마취/건강검진 전 8시간 금식\n물은 수술 2시간 전까지 가능\n복용 중인 약은 미리 알려주세요'},
      {id:uid(), title:'예약 변경·취소', tags:['예약'], pinned:false, content:'전날까지 전화로 변경/취소 부탁드립니다.'},
    ],
  };
}

/* ---------- 저장 ---------- */
function normalize(d){
  if(!d || !Array.isArray(d.services) || !Array.isArray(d.notes)) throw new Error('형식 오류');
  d.services.forEach(s=>{ s.id ||= uid(); s.fields ||= {}; s.options ||= []; s.rules ||= []; s.addons ||= []; s.notes ||= '';
    s.rules = s.rules.map(r=>R(r)); s.addons.forEach(a=>{a.id ||= uid();}); });
  d.notes.forEach(n=>{ n.id ||= uid(); n.tags ||= []; });
  return d;
}
function load(){
  try { const s = localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s)); } catch(e){ console.warn(e); }
  return defaults();
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ alert('저장 실패: '+e.message); } }, 150);
}
let data = load();

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('복사했습니다');
}

/* ---------- 계산 ---------- */
function inRange(v, min, max){
  if(min==null && max==null) return true;
  if(v==null || Number.isNaN(v)) return null; // 값이 없어서 판단 불가
  if(min!=null && v < min) return false;
  if(max!=null && v >= max) return false;
  return true;
}
function rangeText(min, max, unit){
  if(min!=null && max!=null) return `${min}${unit} 이상 ${max}${unit} 미만`;
  if(min!=null) return `${min}${unit} 이상`;
  if(max!=null) return `${max}${unit} 미만`;
  return '';
}
function condText(r){
  return [r.option, SPECIES[r.species], SEX[r.sex], rangeText(r.wMin,r.wMax,'kg'), rangeText(r.ageMin,r.ageMax,'세')].filter(Boolean).join(' · ') || '항상';
}
function calculate(svc, inp){
  const missing = [];
  const f = svc.fields;
  if(f.species && !inp.species) missing.push('종');
  if(f.sex && !inp.sex) missing.push('성별');
  if(f.age && inp.age==null) missing.push('나이');
  if(f.weight && inp.weight==null) missing.push('몸무게');
  const lines = [];
  for(const r of svc.rules){
    if(r.option && svc.options.length && r.option !== inp.option) continue;
    if(r.species && f.species && r.species !== inp.species) continue;
    if(r.sex && f.sex && r.sex !== inp.sex) continue;
    const a = inRange(inp.age, r.ageMin, r.ageMax), w = inRange(inp.weight, r.wMin, r.wMax);
    if(a===false || w===false || a===null || w===null) continue;
    lines.push({label:r.label, cond:condText(r), price:Number(r.price)||0});
  }
  for(const ad of svc.addons){
    const q = inp.addons[ad.id] || 0;
    if(q>0) lines.push({label: ad.label + (ad.unit ? ` × ${q}` : ''), cond:'추가 항목', price:(Number(ad.price)||0)*(ad.unit?q:1)});
  }
  return {missing, lines, total: lines.reduce((s,l)=>s+l.price,0)};
}

/* ---------- 초성 검색 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const toCho = s => [...s].map(c=>{ const k=c.charCodeAt(0)-0xAC00; return (k>=0 && k<11172) ? CHO[Math.floor(k/588)] : c; }).join('');
const isChoQuery = q => /^[ㄱ-ㅎ\s]+$/.test(q);
function matchText(text, q){
  text = String(text||'').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(t => isChoQuery(t) ? toCho(text).includes(t) : text.includes(t));
}
function highlight(text, q){
  let h = esc(text);
  q.split(/\s+/).filter(t=>t && !isChoQuery(t)).forEach(t=>{
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    h = h.replace(re, m=>`<mark>${m}</mark>`);
  });
  return h;
}

/* ---------- 화면 ---------- */
const view = $('#view');
const calcState = {}; // 서비스별 입력값 유지

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [a,b,c] = h.split('/');
  window.scrollTo(0,0);
  if(a==='svc' && b) return renderService(b);
  if(a==='search') return renderSearch(decodeURIComponent(b||''));
  if(a==='settings' && b==='svc' && c) return renderEditService(c);
  if(a==='settings' && b==='note' && c) return renderEditNote(c);
  if(a==='settings') return renderSettings();
  renderHome();
}
window.addEventListener('hashchange', route);

function noteCard(n, q=''){
  return `<div class="card note"><h3>${q?highlight(n.title,q):esc(n.title)}</h3>
    <div style="margin-bottom:6px">${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <p>${q?highlight(n.content,q):esc(n.content)}</p>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-copy="${esc(n.id)}">복사</button><a class="btn sm" href="#/settings/note/${n.id}">수정</a></div></div>`;
}
view.addEventListener('click', e=>{
  const c = e.target.closest('[data-copy]');
  if(c){ const n=data.notes.find(x=>x.id===c.dataset.copy); if(n) copyText(`[${n.title}]\n${n.content}`); }
});

function renderHome(){
  $('#q').value='';
  const pinned = data.notes.filter(n=>n.pinned);
  view.innerHTML = `
    <h1>무엇을 문의하셨나요?</h1>
    <div class="grid">
      ${data.services.map(s=>`<a class="tile" href="#/svc/${s.id}" style="text-decoration:none;color:inherit"><span class="ic">${esc(s.icon||'📋')}</span><b>${esc(s.name)}</b><small>${esc(fieldsLabel(s))}</small></a>`).join('')}
      <a class="tile" href="#/search/" style="text-decoration:none;color:inherit"><span class="ic">🔎</span><b>정보 검색</b><small>저장된 안내문 ${data.notes.length}개</small></a>
    </div>
    ${pinned.length?`<h2>📌 자주 묻는 안내</h2><div class="notes">${pinned.map(n=>noteCard(n)).join('')}</div>`:''}
    <p class="muted" style="margin-top:28px;font-size:14px">⌨️ <kbd>/</kbd> 검색 · <kbd>Esc</kbd> 처음으로 · 가격과 안내문은 ⚙️ 설정에서 수정</p>`;
}
function fieldsLabel(s){
  const f=s.fields, p=[];
  if(f.species)p.push('종'); if(f.sex)p.push('성별'); if(f.age)p.push('나이'); if(f.weight)p.push('몸무게');
  return p.length ? p.join(' · ')+' 입력' : '가격 보기';
}

function renderService(id){
  const svc = data.services.find(s=>s.id===id);
  if(!svc){ location.hash='#/'; return; }
  const st = calcState[id] ||= {species:'dog', sex:'', age:null, weight:null, option:svc.options[0]||'', addons:{}};
  if(svc.options.length && !svc.options.includes(st.option)) st.option = svc.options[0];
  const f = svc.fields;
  const seg = (name, items, cur) => `<div class="seg" data-seg="${name}">${items.map(([v,l])=>`<button type="button" data-v="${esc(v)}" class="${v===cur?'on':''}">${esc(l)}</button>`).join('')}</div>`;
  view.innerHTML = `
    <div class="back"><a class="btn sm" href="#/">← 처음으로</a></div>
    <h1>${esc(svc.icon||'')} ${esc(svc.name)}</h1>
    <div class="calc">
      <div class="card">
        ${svc.options.length?`<div class="field"><label>종류</label>${seg('option', svc.options.map(o=>[o,o]), st.option)}</div>`:''}
        ${f.species?`<div class="field"><label>종</label>${seg('species', [['dog','🐶 개'],['cat','🐱 고양이']], st.species)}</div>`:''}
        ${f.sex?`<div class="field"><label>성별</label>${seg('sex', [['M','수컷'],['F','암컷']], st.sex)}</div>`:''}
        ${f.age?`<div class="field"><label>나이</label><div class="num"><input id="age" type="number" min="0" step="0.5" inputmode="decimal" value="${st.age??''}"> 세</div></div>`:''}
        ${f.weight?`<div class="field"><label>몸무게</label><div class="num"><input id="weight" type="number" min="0" step="0.1" inputmode="decimal" value="${st.weight??''}"> kg</div></div>`:''}
        ${svc.addons.length?`<div class="field"><label>추가 항목</label>${svc.addons.map(a=>`
          <label class="addon"><input type="checkbox" data-addon="${a.id}" ${st.addons[a.id]?'checked':''}>
          ${esc(a.label)} <span class="muted">+${won(a.price)}</span>
          ${a.unit?`<input type="number" min="1" value="${st.addons[a.id]||1}" data-qty="${a.id}"> ${a.label.includes('박')?'박':'개'}`:''}</label>`).join('')}</div>`:''}
        <button class="btn sm" id="reset">입력 초기화</button>
      </div>
      <div class="card result" id="result"></div>
    </div>`;
  const firstInput = $('#weight') || $('#age'); if(firstInput && !st.weight && !st.age) firstInput.focus();
  const update = () => {
    const r = calculate(svc, st);
    const el = $('#result');
    const summary = () => [`[${svc.name}] ${[st.option, SPECIES[f.species&&st.species], SEX[f.sex&&st.sex], f.age&&st.age!=null?st.age+'세':'', f.weight&&st.weight!=null?st.weight+'kg':''].filter(Boolean).join(' / ')}`,
      ...r.lines.map(l=>`- ${l.label}: ${won(l.price)}`), `합계: ${won(r.total)}`].join('\n');
    el.innerHTML = `
      <div class="muted">예상 금액</div>
      ${r.missing.length ? `<div class="hint">입력해 주세요: <b>${r.missing.join(', ')}</b></div>` :
        r.lines.length ? `<div class="total">${won(r.total)}</div>
          <table class="lines">${r.lines.map(l=>`<tr><td>${esc(l.label)}<span class="cond">${esc(l.cond)}</span></td><td>${won(l.price)}</td></tr>`).join('')}</table>
          <div class="row" style="margin-top:12px"><button class="btn sm" id="copySum">내역 복사</button></div>`
        : `<div class="hint">이 조건에 맞는 가격이 없습니다. <a href="#/settings/svc/${svc.id}">설정에서 추가</a></div>`}
      ${svc.notes?`<div class="memo">📝 ${esc(svc.notes)}</div>`:''}`;
    const cs = $('#copySum'); if(cs) cs.onclick = () => copyText(summary());
  };
  view.querySelectorAll('[data-seg]').forEach(g=>g.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    st[g.dataset.seg] = b.dataset.v;
    g.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    update();
  }));
  const num = v => v==='' ? null : Number(v);
  if($('#age')) $('#age').addEventListener('input', e=>{ st.age = num(e.target.value); update(); });
  if($('#weight')) $('#weight').addEventListener('input', e=>{ st.weight = num(e.target.value); update(); });
  view.querySelectorAll('[data-addon]').forEach(cb=>cb.addEventListener('change', ()=>{
    const q = view.querySelector(`[data-qty="${cb.dataset.addon}"]`);
    st.addons[cb.dataset.addon] = cb.checked ? (q ? Math.max(1, Number(q.value)||1) : 1) : 0; update();
  }));
  view.querySelectorAll('[data-qty]').forEach(q=>q.addEventListener('input', ()=>{
    const cb = view.querySelector(`[data-addon="${q.dataset.qty}"]`);
    cb.checked = true; st.addons[q.dataset.qty] = Math.max(1, Number(q.value)||1); update();
  }));
  $('#reset').onclick = () => { delete calcState[id]; renderService(id); };
  update();
}

function renderSearch(q){
  if(document.activeElement !== $('#q')) $('#q').value = q;
  if(!$('#searchResults')) view.innerHTML = `<div class="back"><a class="btn sm" href="#/">← 처음으로</a></div><h1>정보 검색</h1><div id="searchResults"></div>`;
  updateSearch(q);
  if(!q) $('#q').focus();
}
function updateSearch(q){
  q = q.trim().toLowerCase();
  const box = $('#searchResults'); if(!box) return;
  const notes = q ? data.notes.filter(n=>matchText([n.title,n.content,n.tags.join(' ')].join(' '), q)) : data.notes;
  const svcs = q ? data.services.filter(s=>matchText([s.name,s.notes,...s.rules.map(r=>r.label),...s.addons.map(a=>a.label)].join(' '), q)) : [];
  box.innerHTML = `
    ${svcs.length?`<h2>가격 계산</h2><div class="grid">${svcs.map(s=>`<a class="tile" href="#/svc/${s.id}" style="text-decoration:none;color:inherit"><span class="ic">${esc(s.icon||'📋')}</span><b>${highlight(s.name,q)}</b><small>${esc(fieldsLabel(s))}</small></a>`).join('')}</div>`:''}
    <h2>안내문 ${notes.length}개</h2>
    ${notes.length?`<div class="notes">${notes.map(n=>noteCard(n,q)).join('')}</div>`:`<p class="muted">검색 결과가 없습니다. <a href="#/settings/note/new">새 안내문 추가</a></p>`}`;
}
$('#q').addEventListener('input', e=>{
  const q = e.target.value;
  if(!location.hash.startsWith('#/search')) history.replaceState(null,'','#/search/'+encodeURIComponent(q)), renderSearch(q);
  else { history.replaceState(null,'','#/search/'+encodeURIComponent(q)); updateSearch(q); }
});
$('#q').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const t = $('#searchResults a.tile'); if(t) location.hash = t.getAttribute('href'); }
});
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'){ document.activeElement.blur(); location.hash='#/'; }
});

/* ---------- 설정 ---------- */
function renderSettings(){
  view.innerHTML = `
    <div class="back"><a class="btn sm" href="#/">← 처음으로</a></div>
    <h1>⚙️ 설정</h1>
    <h2>가격 계산 항목</h2>
    <div class="card">${data.services.map((s,i)=>`
      <div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${esc(s.icon)} <b>${esc(s.name)}</b> <span class="muted">· 가격 ${s.rules.length}줄 · 추가항목 ${s.addons.length}개</span></span>
        <span class="row"><button class="btn sm" data-move="${i}" data-d="-1">▲</button><button class="btn sm" data-move="${i}" data-d="1">▼</button><a class="btn sm" href="#/settings/svc/${s.id}">수정</a></span>
      </div>`).join('')}
      <div style="margin-top:10px"><button class="btn pri sm" id="addSvc">+ 항목 추가 (예: 예방접종, 미용)</button></div>
    </div>
    <h2>안내문 (검색용)</h2>
    <div class="card">${data.notes.map(n=>`
      <div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${n.pinned?'📌 ':''}<b>${esc(n.title)}</b> ${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span>
        <a class="btn sm" href="#/settings/note/${n.id}">수정</a>
      </div>`).join('')}
      <div style="margin-top:10px"><a class="btn pri sm" href="#/settings/note/new">+ 안내문 추가</a></div>
    </div>
    <h2>백업 / 다른 컴퓨터로 옮기기</h2>
    <div class="card">
      <p class="muted" style="margin-top:0">데이터는 이 컴퓨터의 이 브라우저에만 저장됩니다. 브라우저 기록 삭제 시 지워질 수 있으니 가끔 백업 파일을 받아두세요. 병원 컴퓨터로 옮길 때도 백업 파일을 불러오면 됩니다.</p>
      <div class="row">
        <button class="btn pri" id="export">💾 백업 파일 받기</button>
        <label class="btn">📂 백업 파일 불러오기<input type="file" id="import" accept=".json,application/json" hidden></label>
        <button class="btn danger" id="resetAll">처음 예시 데이터로 되돌리기</button>
      </div>
    </div>`;
  view.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.move, j=i+(+b.dataset.d); if(j<0||j>=data.services.length) return;
    [data.services[i],data.services[j]]=[data.services[j],data.services[i]]; save(); renderSettings();
  });
  $('#addSvc').onclick = () => {
    const s = {id:uid(), name:'새 항목', icon:'📋', fields:{species:true, sex:false, age:false, weight:true}, options:[], rules:[R({label:'기본 가격', price:0})], addons:[], notes:''};
    data.services.push(s); save(); location.hash = '#/settings/svc/'+s.id;
  };
  $('#export').onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `전화응대_백업_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#import').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    try { const d = normalize(JSON.parse(await file.text()));
      if(!confirm(`가격 항목 ${d.services.length}개, 안내문 ${d.notes.length}개를 불러옵니다.\n지금 데이터는 덮어씌워집니다. 계속할까요?`)) return;
      data = d; save(); toast('불러왔습니다'); renderSettings();
    } catch(err){ alert('불러오기 실패: 올바른 백업 파일이 아닙니다.'); }
  };
  $('#resetAll').onclick = () => { if(confirm('모든 데이터를 지우고 예시 데이터로 되돌립니다. 계속할까요?')){ data = defaults(); save(); renderSettings(); toast('초기화했습니다'); } };
}

function renderEditService(id){
  const s = data.services.find(x=>x.id===id); if(!s){ location.hash='#/settings'; return; }
  const sel = (key, val, opts) => `<select data-k="${key}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===(val||'')?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const nv = v => v==null ? '' : v;
  view.innerHTML = `
    <div class="back row"><a class="btn sm" href="#/settings">← 설정</a><a class="btn sm" href="#/svc/${s.id}">계산 화면 보기</a></div>
    <h1>${esc(s.icon)} ${esc(s.name)} 수정</h1>
    <p class="muted">수정하면 바로 저장됩니다.</p>
    <div class="card form">
      <div class="row" style="align-items:flex-end">
        <div style="width:80px"><label class="muted">아이콘</label><input type="text" id="sIcon" value="${esc(s.icon)}"></div>
        <div style="flex:1;min-width:160px"><label class="muted">이름</label><input type="text" id="sName" value="${esc(s.name)}"></div>
      </div>
      <div class="field" style="margin-top:12px"><label>전화 받을 때 물어볼 것</label>
        <div class="row">${[['species','종 (개/고양이)'],['sex','성별'],['age','나이'],['weight','몸무게']].map(([k,l])=>`<label><input type="checkbox" data-field="${k}" ${s.fields[k]?'checked':''}> ${l}</label>`).join('')}</div>
      </div>
      <div class="field"><label>종류 선택지 (쉼표로 구분, 예: 기본, 정밀) — 없으면 비워두기</label><input type="text" id="sOpts" value="${esc(s.options.join(', '))}"></div>
    </div>

    <h2>가격표</h2>
    <p class="muted" style="margin-top:-4px;font-size:14px">조건에 맞는 줄이 <b>모두 더해집니다</b>. 빈 칸 = 상관없음. 범위는 "이상 ~ 미만" (예: 5 ~ 10kg 은 5kg 이상 10kg 미만).</p>
    <div class="card scroll"><table class="edit" id="rules">
      <tr><th>내용</th>${s.options.length?'<th>종류</th>':''}<th>종</th><th>성별</th><th>kg 이상</th><th>kg 미만</th><th>나이 이상</th><th>나이 미만</th><th>가격(원)</th><th></th></tr>
      ${s.rules.map(r=>`<tr data-id="${r.id}">
        <td style="min-width:180px"><input data-k="label" value="${esc(r.label)}"></td>
        ${s.options.length?`<td>${sel('option', r.option, [['','전체'],...s.options.map(o=>[o,o])])}</td>`:''}
        <td>${sel('species', r.species, [['','전체'],['dog','개'],['cat','고양이']])}</td>
        <td>${sel('sex', r.sex, [['','전체'],['M','수컷'],['F','암컷']])}</td>
        <td><input data-k="wMin" data-n type="number" step="0.1" value="${nv(r.wMin)}"></td>
        <td><input data-k="wMax" data-n type="number" step="0.1" value="${nv(r.wMax)}"></td>
        <td><input data-k="ageMin" data-n type="number" step="0.5" value="${nv(r.ageMin)}"></td>
        <td><input data-k="ageMax" data-n type="number" step="0.5" value="${nv(r.ageMax)}"></td>
        <td style="min-width:110px"><input data-k="price" data-n type="number" step="1000" value="${nv(r.price)}"></td>
        <td class="row" style="flex-wrap:nowrap"><button class="btn sm" data-dup title="복사">⧉</button><button class="btn sm danger" data-del title="삭제">✕</button></td></tr>`).join('')}
    </table>
    <button class="btn sm pri" id="addRule" style="margin-top:10px">+ 가격 줄 추가</button></div>

    <h2>추가 항목 (체크해서 더하는 것)</h2>
    <div class="card scroll"><table class="edit" id="addons">
      <tr><th>내용</th><th>가격(원)</th><th>수량 입력</th><th></th></tr>
      ${s.addons.map(a=>`<tr data-id="${a.id}"><td style="min-width:180px"><input data-k="label" value="${esc(a.label)}"></td>
        <td><input data-k="price" data-n type="number" step="1000" value="${nv(a.price)}"></td>
        <td><input data-k="unit" type="checkbox" ${a.unit?'checked':''} style="width:auto"> 개수/박수</td>
        <td><button class="btn sm danger" data-del>✕</button></td></tr>`).join('')}
    </table>
    <button class="btn sm pri" id="addAddon" style="margin-top:10px">+ 추가 항목</button></div>

    <h2>안내 메모 (계산 화면에 같이 보임)</h2>
    <div class="card form"><textarea id="sNotes">${esc(s.notes)}</textarea></div>

    <div style="margin-top:24px"><button class="btn danger" id="delSvc">이 항목 전체 삭제</button></div>`;

  $('#sIcon').oninput = e => { s.icon = e.target.value; save(); };
  $('#sName').oninput = e => { s.name = e.target.value; save(); };
  $('#sNotes').oninput = e => { s.notes = e.target.value; save(); };
  $('#sOpts').onchange = e => { s.options = e.target.value.split(',').map(x=>x.trim()).filter(Boolean); save(); renderEditService(id); };
  view.querySelectorAll('[data-field]').forEach(cb=>cb.onchange=()=>{ s.fields[cb.dataset.field]=cb.checked; save(); });
  const bindTable = (tableId, list, rerender) => {
    const t = $('#'+tableId);
    const handler = e => {
      const tr = e.target.closest('tr[data-id]'); const k = e.target.dataset.k; if(!tr || !k) return;
      const item = list.find(x=>x.id===tr.dataset.id); if(!item) return;
      if(e.target.type==='checkbox') item[k] = e.target.checked;
      else if('n' in e.target.dataset) item[k] = e.target.value==='' ? null : Number(e.target.value);
      else item[k] = e.target.value;
      save();
    };
    t.addEventListener('input', handler); t.addEventListener('change', handler);
    t.addEventListener('click', e=>{
      const tr = e.target.closest('tr[data-id]'); if(!tr) return;
      const i = list.findIndex(x=>x.id===tr.dataset.id);
      if(e.target.closest('[data-del]')){ if(confirm('이 줄을 삭제할까요?')){ list.splice(i,1); save(); rerender(); } }
      if(e.target.closest('[data-dup]')){ list.splice(i+1,0,{...list[i], id:uid()}); save(); rerender(); }
    });
  };
  const re = () => renderEditService(id);
  bindTable('rules', s.rules, re);
  bindTable('addons', s.addons, re);
  $('#addRule').onclick = () => { s.rules.push(R({label:s.name})); save(); re(); };
  $('#addAddon').onclick = () => { s.addons.push(A('새 추가 항목', 0)); save(); re(); };
  $('#delSvc').onclick = () => { if(confirm(`'${s.name}' 항목을 삭제할까요?`)){ data.services = data.services.filter(x=>x!==s); save(); location.hash='#/settings'; } };
}

function renderEditNote(id){
  let n = data.notes.find(x=>x.id===id);
  const isNew = !n;
  if(isNew) n = {id:uid(), title:'', tags:[], pinned:false, content:''};
  view.innerHTML = `
    <div class="back"><a class="btn sm" href="#/settings">← 설정</a></div>
    <h1>${isNew?'안내문 추가':'안내문 수정'}</h1>
    <div class="card form">
      <div class="field"><label>제목</label><input type="text" id="nTitle" value="${esc(n.title)}" placeholder="예: 진료 시간"></div>
      <div class="field"><label>태그 (쉼표로 구분)</label><input type="text" id="nTags" value="${esc(n.tags.join(', '))}" placeholder="예: 예약, 수술"></div>
      <div class="field"><label>내용</label><textarea id="nContent" style="min-height:200px">${esc(n.content)}</textarea></div>
      <label><input type="checkbox" id="nPin" ${n.pinned?'checked':''}> 📌 첫 화면에 고정</label>
      <div class="row" style="margin-top:16px">
        <button class="btn pri" id="nSave">저장</button>
        ${isNew?'':'<button class="btn danger" id="nDel">삭제</button>'}
      </div>
    </div>`;
  $('#nTitle').focus();
  $('#nSave').onclick = () => {
    const title = $('#nTitle').value.trim(); if(!title){ alert('제목을 입력하세요'); return; }
    Object.assign(n, {title, tags:$('#nTags').value.split(',').map(x=>x.trim()).filter(Boolean), content:$('#nContent').value, pinned:$('#nPin').checked});
    if(isNew) data.notes.push(n);
    save(); toast('저장했습니다'); location.hash = '#/settings';
  };
  if(!isNew) $('#nDel').onclick = () => { if(confirm('삭제할까요?')){ data.notes = data.notes.filter(x=>x!==n); save(); location.hash='#/settings'; } };
}

route();
</script>
